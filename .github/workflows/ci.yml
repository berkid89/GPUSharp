name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build .NET
        run: dotnet build GPUSharp.slnx

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        working-directory: rust/gpusharp-compiler
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust/gpusharp-compiler
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: rust/gpusharp-compiler
        run: cargo test --locked --all-targets

      - name: Doctests
        working-directory: rust/gpusharp-compiler
        run: cargo test --locked --doc

      - name: Documentation
        working-directory: rust/gpusharp-compiler
        run: cargo doc --locked --no-deps

      - name: Package
        working-directory: rust/gpusharp-compiler
        run: cargo package --locked

      - name: Build release
        working-directory: rust/gpusharp-compiler
        run: cargo build --release --locked

      - name: Upload gpusharp-compiler
        uses: actions/upload-artifact@v7
        with:
          name: gpusharp-compiler-linux
          path: rust/gpusharp-compiler/target/release/gpusharp-compiler
          if-no-files-found: error
